[workspace]
resolver = "2"
members = [
    "crates/metafile",
    "crates/rpt-reader",
    "crates/rpt-model",
    "crates/rpt-formula",
    "crates/rpt-kdl",
    "crates/rpt-json",
    "apps/rpt-cli",
    "crates/rpt-pages",
    "crates/rpt-format-value",
    "crates/rpt-data",
    "crates/rpt-query",
    "crates/rpt-layout",
    "crates/rpt-text",
    "crates/rpt-render",
    "apps/rpt-render-cli",
    "crates/rpt-render-pdf",
    "crates/rpt-db-postgres",
    "crates/rpt-db-sqlite",
    "crates/rpt-render-util",
    "crates/rpt-test-support",
    "apps/meridian-seed",
]

[workspace.package]
# The single source of truth for the project version: every crate inherits it with
# `version.workspace = true`, the binaries read it at compile time via `CARGO_PKG_VERSION`, and a
# release tag is checked against it by `scripts/check-release-version.sh`.
version = "0.4.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Martin Srsen <martin@srsen.sk>"]
repository = "https://github.com/MrSrsen/rpt-rs"
readme = "README.md"
keywords = ["crystal-reports", "rpt", "parser", "report", "renderer"]
categories = ["parser-implementations", "encoding"]
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A public fallible function must say what can fail, and a public panicking one must say when. The
# audit that produced these found the gaps by hand; the compiler finds them now. Both are `pedantic`
# lints, so they are named individually rather than by enabling the whole group.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# DELIBERATELY NOT ENABLED — measured, then declined. The count is each lint's lib+bins hit count.
#
#   unwrap_used (28) / expect_used (15)
#     Most remaining sites are `expect` with a message stating a locally-proven invariant, which reads
#     better than the `let ... else` it would become. The panic-hardening pass went through the sites
#     that take untrusted input (formula text, report bytes) individually; a blanket lint would bury
#     those judgements under the ones that were never in question. Revisit per-crate if a new crate
#     starts taking untrusted input.
#
#   let_underscore_must_use (147)
#     Overwhelmingly unused-parameter markers in default trait methods (metafile's MetafileSink,
#     rpt-formula's EvalContext), where `let _ = x;` is the idiom. Signal-to-noise is far too low
#     to act on, exactly as the audit predicted.
#
#   let_underscore_untyped (17)
#     Same shape, smaller count, same conclusion — it flags the idiom rather than the hazard.
#
# The rule these encode: a lint earns its place by catching the failure mode it is named for more
# often than it flags a deliberate choice.

[workspace.dependencies]
metafile = { path = "crates/metafile" }
rpt-reader = { path = "crates/rpt-reader" }
rpt-model = { path = "crates/rpt-model" }
rpt-formula = { path = "crates/rpt-formula" }
rpt-kdl = { path = "crates/rpt-kdl" }
rpt-json = { path = "crates/rpt-json" }
rpt-pages = { path = "crates/rpt-pages" }
rpt-format-value = { path = "crates/rpt-format-value" }
rpt-data = { path = "crates/rpt-data" }
rpt-query = { path = "crates/rpt-query" }
rpt-db-postgres = { path = "crates/rpt-db-postgres" }
rpt-db-sqlite = { path = "crates/rpt-db-sqlite" }
rpt-layout = { path = "crates/rpt-layout" }
rpt-text = { path = "crates/rpt-text", default-features = false }
rpt-render = { path = "crates/rpt-render" }
rpt-render-pdf = { path = "crates/rpt-render-pdf" }
rpt-render-util = { path = "crates/rpt-render-util" }
rpt-test-support = { path = "crates/rpt-test-support" }
cfb = "0.14"
# kdl 6.6.0+ require rustc 1.95; cap at 6.5.x to stay within the workspace MSRV (1.92).
kdl = ">=6.5.0, <6.6.0"
miniz_oxide = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_chacha = { version = "0.9", default-features = false }
rand_core = "0.9"
# Render/data pipeline third-party deps. Hoisted so a version can't drift into two compiled copies
# (fontdb especially: one version across the pdf and text crates). Per-crate feature sets and
# `optional`/`default-features` stay at the leaf via `name = { workspace = true, ... }`.
fontdb = "0.23"
ttf-parser = "0.25"
cosmic-text = "0.19"
krilla = { version = "0.8.2", default-features = false }
harfrust = "0.5"
postgres = "0.19"
rusqlite = "0.32"
sea-query = { version = "0.32", default-features = false }
similar = "3"

[profile.release]
lto = "thin"
# Keep line-table debug info (and the symbol table) in release so the panic backtrace from
# each binary's panic hook carries function names + source locations. Line tables only — no
# runtime cost, just a larger binary on disk; `debug = true` (full DWARF) is not needed.
debug = "line-tables-only"
strip = false
# Move the DWARF bodies out of the executable into a sidecar the release archives do not carry.
# Backtraces still resolve without it: Linux split-DWARF leaves `.debug_line` and `.debug_addr` in
# the executable and relocates only `.debug_info`/`.debug_str`, so function names and source lines
# survive with no sidecar present. This is purely a shipping-size decision, not a debuggability one.
split-debuginfo = "packed"

# Do not compile SQLite's C amalgamation with debug info. `debug = "line-tables-only"` sets Cargo's
# DEBUG=1, the `cc` crate honours it, and the result is megabytes of DWARF for code nobody will ever
# step through — it is the entire source of this binary's `.debug_loc`, a section the pure-Rust `rpt`
# binary does not have at all.
[profile.release.package.libsqlite3-sys]
debug = false
