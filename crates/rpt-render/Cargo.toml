[package]
name = "rpt-render"
description = "End-to-end render orchestrator: a decoded rpt Report + its data → paginated Page IR, ready for any output backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
rpt-reader = { workspace = true, features = ["serde"] }
rpt-formula = { workspace = true }
rpt-data = { workspace = true }
rpt-layout = { workspace = true }
rpt-pages = { workspace = true }
rpt-render-pdf = { workspace = true }
rpt-text = { workspace = true, features = ["cosmic"] }
thiserror = { workspace = true }

[dev-dependencies]
# Full-stack data-driven render tests: seed a committed portable SQL fixture into PostgreSQL, feed the
# rows through the pipeline, and check the Page IR against a committed baseline. PostgreSQL is the single
# DB technology for the render-test corpus, so the only variable under test is rendering, not the
# datasource. The test skips when no
# `RPT_DB_URL`/`DATABASE_URL` is set, so a DB-less `cargo test` stays green (CI provides a service).
rpt-db-postgres = { workspace = true }
rpt-test-support = { workspace = true }
# Serializes the document-scoped half of the Page IR into the page-ir baselines.
serde_json = { workspace = true }
similar = { workspace = true }

[lints]
workspace = true
